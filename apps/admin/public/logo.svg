<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shree Saibaba">
  <title>Shree Saibaba</title>
  <defs>
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="innerFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="diyaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Sacred Circular Medallion with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#aura)" stroke="url(#goldBorder)" stroke-width="2"/>
  
  <!-- Subtle Rays of Divine Light -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="6" x2="32" y2="10"/>
    <line x1="48" y1="12" x2="45" y2="15"/>
    <line x1="56" y1="26" x2="52" y2="27"/>
    <line x1="8" y1="26" x2="12" y2="27"/>
    <line x1="16" y1="12" x2="19" y2="15"/>
  </g>

  <!-- Sun Halo / Aura Arc -->
  <path d="M19 26 A13 13 0 0 1 45 26" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>

  <!-- Divine Flame (Jyoti) -->
  <path d="M32 12 C26 21 24 27 28 32 C30 34.5 34 34.5 36 32 C40 27 38 21 32 12 Z" fill="url(#flameGrad)"/>
  <path d="M32 17 C28.5 23 27.5 27 30 30.5 C31.2 32 32.8 32 34 30.5 C36.5 27 35.5 23 32 17 Z" fill="url(#innerFlame)"/>

  <!-- Sacred Diya (Lamp) Body -->
  <path d="M14 36 C14 36 17 48 32 48 C47 48 50 36 50 36 C50 36 43 40 32 40 C21 40 14 36 14 36 Z" fill="url(#diyaGrad)"/>
  
  <!-- Diya Rim / Lotus Petal Accents -->
  <path d="M14 36 Q32 41 50 36" fill="none" stroke="#fde68a" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="32" cy="44" r="1.5" fill="#fde68a"/>
  <circle cx="25" cy="42" r="1.2" fill="#fde68a" opacity="0.8"/>
  <circle cx="39" cy="42" r="1.2" fill="#fde68a" opacity="0.8"/>
  
  <!-- Lotus Base Foundation -->
  <path d="M22 49 Q32 54 42 49 Q32 51 22 49 Z" fill="#b45309"/>
</svg>
