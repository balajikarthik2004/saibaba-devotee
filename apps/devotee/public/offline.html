<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e08c0a" />
    <title>Offline · Shree Saibaba</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf6ec;color:#241a14;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
      main{max-width:26rem}
      img{width:84px;height:84px;border-radius:20px}
      h1{font-size:1.4rem;margin:1rem 0 .5rem}
      p{color:#6f6157;line-height:1.6;margin:.5rem 0}
      button,a.btn{display:inline-block;margin-top:1rem;padding:.7rem 1.2rem;border-radius:10px;border:0;background:#9c1f16;color:#fff;font:inherit;text-decoration:none;cursor:pointer}
      button:focus-visible,a:focus-visible{outline:3px solid #e08c0a;outline-offset:2px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Baba is always with you. This page is not saved on your device yet, so we cannot show it without a connection.</p>
      <p>Aartis and today's schedule that you opened earlier are still available.</p>
      <a class="btn" href="/darshan">Open saved aartis</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
