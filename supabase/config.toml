# Supabase CLI config (local dev + `supabase link` deploys).
# UNTESTED against a live project / the Supabase CLI. Verify keys against your CLI version
# (`supabase init` writes a full reference config) before relying on this file.
project_id = "shree-saibaba"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"          # resend throttle; the UI mirrors this with a 60s timer

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Shree Sai verification code is {{ .Code }}"
max_frequency = "60s"
# Configure ONE provider (Twilio Verify recommended) and put its secrets in the environment:
# [auth.sms.twilio]
# enabled = true
# account_sid = "env(TWILIO_ACCOUNT_SID)"
# message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
# auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.external.google]
enabled = false                # set true after creating OAuth credentials
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(APPLE_OAUTH_CLIENT_ID)"
secret = "env(APPLE_OAUTH_SECRET)"

[edge_runtime]
enabled = true

# JWT verification is OFF where the caller is not a Supabase user (webhooks, guest giving) or where
# the function authenticates itself; each function documents and enforces its own auth.
[functions.payments]
verify_jwt = false

[functions.notify]
verify_jwt = false

[functions.daily-message-cron]
verify_jwt = false             # protected by x-cron-secret

[functions.receipt-pdf]
verify_jwt = true

[functions.admin-invite-staff]
verify_jwt = true
